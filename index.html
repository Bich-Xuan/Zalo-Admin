<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển hướng Zalo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .btn {
      margin-top: 25px;
      padding: 14px 28px;
      background-color: #0068ff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(0, 104, 255, 0.3);
      display: inline-block;
    }
    p {
      color: #333;
      font-size: 15px;
      margin: 0;
    }
  </style>
</head>
<body>
  <p>Đang chuyển tiếp tới Zalo...</p>
  <a class="btn" href="https://zalo.me/0865385027">Mở Zalo ngay</a>

  <script>
    // Thử mở qua giao thức app
    window.location.href = "zalo://conversation?phone=0865385027";

    // Nếu không tự nhảy, chuyển sang link zalo.me sau 1 giây
    setTimeout(function() {
      window.location.href = "https://zalo.me/0865385027";
    }, 1000);
  </script>
</body>
</html>
